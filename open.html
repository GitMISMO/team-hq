<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Opening…</title>
<style>
html,body{margin:0;height:100%;background:#f1f6fa;font-family:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
.msg{position:fixed;inset:0;display:grid;place-items:center;color:#456179;font-size:15px}
</style>
</head>
<body>
<div class="msg" id="msg">Opening…</div>
<script>
/* Team HQ's "open in a new tab" for a tile that points at one page of a system (MISMO Money's Square
   Payments, say). The system opens full-size in this tab and is taken straight to that page, the same
   way it is inside Team HQ — so the systems themselves don't need changing.
   Only pages on resources.mismo.org are ever opened here. */
(function(){
  var q=new URLSearchParams(location.search);
  var u=q.get('u')||'', go=q.get('go')||'', sec=q.get('sec')||'', n=q.get('n')||'';
  var msg=document.getElementById('msg');
  if(!/^\/[A-Za-z0-9._~\-\/]*$/.test(u) || /^\/\//.test(u)){ msg.textContent='That link isn’t one Team HQ opens.'; return; }
  if(n) document.title=n+(go?' · '+go:'');
  if(!go && !sec){ location.replace(u); return; }
  var fr=document.createElement('iframe'); fr.src=u; fr.title=n||'MISMO'; document.body.appendChild(fr);
  var norm=function(t){ return (t||'').replace(/\s+/g,' ').trim().replace(/\s*\d+$/,''); };
  fr.addEventListener('load', function(){
    msg.remove();
    var doc=null; try{ doc=fr.contentDocument; }catch(e){} if(!doc) return;
    var g=go, sc=sec, tries=0, user=false, reached=!go, streak=0;
    var stop=function(e){ var t=e && e.target; if(reached || (t && t.closest && t.closest('nav,[role=tab],.navbtn'))) user=true; };
    doc.addEventListener('pointerdown', stop, true); doc.addEventListener('keydown', stop, true);
    var scrollTo=function(){ var hd=[].slice.call(doc.querySelectorAll('h2,h3')).find(function(z){ return norm(z.textContent).toLowerCase().indexOf(sc.toLowerCase())===0; }); if(hd){ hd.scrollIntoView({block:'start'}); return true; } return false; };
    var step=function(){ tries++; if(user){ g=null; sc=null; }
      if(g){ var b=[].slice.call(doc.querySelectorAll('.hq nav button, nav button, nav a, [role=tab]')).find(function(z){ return norm(z.textContent)===g; });
        if(b){ var on=b.getAttribute('aria-selected')==='true' || (b.hasAttribute('aria-current') && b.getAttribute('aria-current')!=='false') || /(^|\s)(on|active|is-active|current|selected)(\s|$)/.test(b.className||'');
          if(on){ reached=true; streak++; if(sc && scrollTo() && streak>=8) sc=null; if(streak>=8) g=null; } else { streak=0; if(tries%2===1) b.click(); } } }
      else if(sc && scrollTo() && tries>8) sc=null;
      try{ var t=doc.title; if(t && n) document.title=t; }catch(e){}
      if(tries<150 && (g || sc)) setTimeout(step, 700); };
    step();
  });
})();
</script>
</body>
</html>
